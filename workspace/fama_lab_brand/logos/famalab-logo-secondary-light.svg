<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c9a962"/>
      <stop offset="50%" style="stop-color:#e5d4a1"/>
      <stop offset="100%" style="stop-color:#c9a962"/>
    </linearGradient>
    <linearGradient id="goldGradientV" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#c9a962"/>
      <stop offset="50%" style="stop-color:#e5d4a1"/>
      <stop offset="100%" style="stop-color:#c9a962"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="200" fill="#ffffff"/>
  
  <!-- Icon Mark - Abstract "F" with lab flask inspiration -->
  <g transform="translate(40, 50)">
    <!-- Main F shape with gradient -->
    <path d="M0 0 L60 0 L60 15 L25 15 L25 40 L50 40 L50 55 L25 55 L25 100 L0 100 Z" fill="url(#goldGradientV)"/>
    
    <!-- Decorative dot/accent -->
    <circle cx="70" cy="85" r="8" fill="#c9a962"/>
    
    <!-- Lab flask element (small accent) -->
    <path d="M75 75 L85 75 L85 95 L80 100 L80 95 L75 95 Z" fill="#a08040"/>
  </g>
  
  <!-- Wordmark -->
  <g transform="translate(130, 100)">
    <text font-family="Playfair Display, Georgia, serif" font-size="48" font-weight="700" fill="#0a0a0a" letter-spacing="2">
      FAMA<tspan fill="url(#goldGradient)">.LAB</tspan>
    </text>
  </g>
  
  <!-- Tagline -->
  <text x="200" y="145" font-family="Inter, Arial, sans-serif" font-size="12" fill="#c9a962" text-anchor="middle" letter-spacing="4">
    INNOVATION • EXCELLENCE • DESIGN
  </text>
</svg>