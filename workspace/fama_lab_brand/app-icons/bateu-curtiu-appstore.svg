<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#111111"/>
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c9a962"/>
      <stop offset="50%" style="stop-color:#e5d4a1"/>
      <stop offset="100%" style="stop-color:#c9a962"/>
    </linearGradient>
    <linearGradient id="goldGradientV" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#c9a962"/>
      <stop offset="50%" style="stop-color:#e5d4a1"/>
      <stop offset="100%" style="stop-color:#c9a962"/>
    </linearGradient>
  </defs>
  
  <!-- iOS App Icon Background -->
  <rect width="1024" height="1024" fill="url(#bgGradient)" rx="220" ry="220"/>
  
  <!-- Outer ring -->
  <circle cx="512" cy="512" r="460" fill="none" stroke="url(#goldGradient)" stroke-width="10"/>
  
  <!-- Inner decorative ring -->
  <circle cx="512" cy="512" r="420" fill="none" stroke="#c9a962" stroke-width="3" opacity="0.5"/>
  
  <!-- BATEU text -->
  <text x="512" y="300" font-family="Playfair Display, Georgia, serif" font-size="110" font-weight="700" fill="url(#goldGradient)" text-anchor="middle" letter-spacing="8">
    BATEU
  </text>
  
  <!-- Decorative line -->
  <line x1="256" y1="360" x2="768" y2="360" stroke="url(#goldGradient)" stroke-width="5"/>
  
  <!-- CURTIU text -->
  <text x="512" y="680" font-family="Playfair Display, Georgia, serif" font-size="110" font-weight="700" fill="url(#goldGradient)" text-anchor="middle" letter-spacing="8">
    CURTIU
  </text>
  
  <!-- Heart icon in center -->
  <g transform="translate(462, 410) scale(0.9)">
    <path d="M50 90 C20 60, 0 40, 0 25 C0 10, 10 0, 25 0 C35 0, 45 5, 50 15 C55 5, 65 0, 75 0 C90 0, 100 10, 100 25 C100 40, 80 60, 50 90 Z" fill="url(#goldGradient)"/>
    
    <!-- Shine effect -->
    <ellipse cx="30" cy="20" rx="12" ry="8" fill="#ffffff" opacity="0.4"/>
  </g>
  
  <!-- Decorative side dots -->
  <circle cx="180" cy="512" r="10" fill="#e5d4a1"/>
  <circle cx="844" cy="512" r="10" fill="#e5d4a1"/>
  
  <!-- Apple-specific: Subtle inner shadow effect -->
  <circle cx="512" cy="512" r="490" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.1"/>
</svg>