<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#111111"/>
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c9a962"/>
      <stop offset="50%" style="stop-color:#e5d4a1"/>
      <stop offset="100%" style="stop-color:#c9a962"/>
    </linearGradient>
  </defs>
  
  <!-- Rounded background -->
  <rect width="180" height="180" fill="url(#bgGradient)" rx="40" ry="40"/>
  
  <!-- Outer ring -->
  <circle cx="90" cy="90" r="80" fill="none" stroke="url(#goldGradient)" stroke-width="3"/>
  
  <!-- Inner decorative -->
  <circle cx="90" cy="90" r="70" fill="none" stroke="#c9a962" stroke-width="1" opacity="0.5"/>
  
  <!-- Simplified text - BATEU -->
  <text x="90" y="55" font-family="Playfair Display, Georgia, serif" font-size="20" font-weight="700" fill="url(#goldGradient)" text-anchor="middle" letter-spacing="2">
    BATEU
  </text>
  
  <!-- Divider -->
  <line x1="45" y1="70" x2="135" y2="70" stroke="url(#goldGradient)" stroke-width="2"/>
  
  <!-- Simplified text - CURTIU -->
  <text x="90" y="105" font-family="Playfair Display, Georgia, serif" font-size="20" font-weight="700" fill="url(#goldGradient)" text-anchor="middle" letter-spacing="2">
    CURTIU
  </text>
  
  <!-- Heart icon -->
  <g transform="translate(78, 115) scale(0.4)">
    <path d="M50 90 C20 60, 0 40, 0 25 C0 10, 10 0, 25 0 C35 0, 45 5, 50 15 C55 5, 65 0, 75 0 C90 0, 100 10, 100 25 C100 40, 80 60, 50 90 Z" fill="url(#goldGradient)"/>
  </g>
</svg>